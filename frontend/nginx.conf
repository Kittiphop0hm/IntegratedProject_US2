# HTTP → redirect HTTPS
server {
    listen 80;
    server_name intproj24.sit.kmutt.ac.th;

    location / {
        if ($request_uri ~ "^/us2") {
            return 301 https://$host$request_uri;
        }
        return 301 https://$host/us2$request_uri;
    }
}
# HTTPS main server
server {
    listen 443 ssl;
    server_name intproj24.sit.kmutt.ac.th;

    # SSL certs
    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_dhparam         /etc/nginx/ssl/dhparam-2048.pem;

    ssl_protocols        TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    location /itb-mshop/ {
        proxy_pass http://be-container:8080/itb-mshop/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /us2/itb-mshop/ {
        proxy_pass http://be-container:8080/us2/itb-mshop/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /us2/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /us2/index.html;
    }

    # error page
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
