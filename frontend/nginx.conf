
server {
    listen 80;
    server_name intproj24.sit.kmutt.ac.th;        

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    location /itb-mshop/ {
        proxy_pass http://be-container:8080/itb-mshop/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /us2/itb-mshop/ {
        proxy_pass http://be-container:8080/us2/itb-mshop/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /us2/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /us2/index.html;
    }
}
